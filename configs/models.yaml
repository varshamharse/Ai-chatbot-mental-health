baseline:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    random_state: 42
  svm:
    kernel: "linear"
    C: 1.0
    probability: true
    random_state: 42
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    random_state: 42
    n_jobs: -1
  knn:
    n_neighbors: 5
    weights: "distance"
    metric: "cosine"
    n_jobs: -1
  naive_bayes:
    alpha: 1.0
    fit_prior: true

feature_extraction:
  method: "tfidf"
  max_features: 5000
  ngram_range: [1, 2]
  sublinear_tf: true
  min_df: 2
  max_df: 0.95

deep_learning:
  lstm:
    embedding_dim: 100
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3

transformers:
  bert:
    pretrained_model_name: "bert-base-uncased"
    num_labels: 2
